<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ document.filename }} - AutoScroll</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #1e1e1e;
            color: white;
        }

        header {
            padding: 16px 24px;
            background: #333;
        }

        h1 {
            margin: 0;
            font-size: 24px;
        }

        .pdf-container {
            padding: 20px;
        }

        embed {
            display: block;
            width: 100%;
            height: 85vh;
            border: none;
            background: white;
        }

        .back-link {
            display: inline-block;
            margin-top: 12px;
            color: #9ecbff;
        }
    </style>
</head>
<body>
    <header>
        <h1>{{ document.filename }}</h1>
    </header>

    <main class="pdf-container">
        <iframe
            src="{{ document.file.url }}"
            width="100%"
            height="800"
            style="border: none; background: white;"
            title="{{ document.filename }}"
        ></iframe>

        <p>
            <a class="back-link" href="/">Upload another PDF</a>
        </p>
    </main>
</body>
</html>
